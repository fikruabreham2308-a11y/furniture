<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop | Hossana Furniture</title>
    <link rel="stylesheet" href="css/shop.css">
</head>
<body>

    <nav class="navbar">
        <div class="container nav-flex">
            <div class="logo">HOSSANA<span>FURNITURE</span></div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html" class="active">Shop</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="dashboard.html">Dashboards</a></li>
            </ul>
            <div class="nav-icons">
                <div class="cart-wrapper" onclick="location.href='cart.html'">
                    <span class="icon">🛒</span>
                    <span id="cart-count">0</span>
                </div>
            </div>
        </div>
    </nav>

    <header class="shop-header">
        <div class="container">
            <h1>Our Collection</h1>
            <p>Premium furniture delivered right to your door in Hossana.</p>
        </div>
    </header>

    <div class="container shop-container">
        <aside class="sidebar">
            <div class="filter-card">
                <h3>Search</h3>
                <input type="text" id="productSearch" placeholder="Search furniture..." class="search-input">
            </div>

            <div class="filter-card">
                <h3>Categories</h3>
                <select id="categoryFilter" class="search-input">
                    <option value="all">All Items</option>
                    <option value="Sofa">Sofas</option>
                    <option value="Beds">Beds</option>
                    <option value="Chairs">Chairs</option>
                    <option value="Tables">Tables</option>
                    <option value="Office">Office Furniture</option>
                </select>
            </div>

            <div class="filter-card">
                <h3>Price Range</h3>
                <select id="priceFilter" class="search-input">
                    <option value="all">Any Price</option>
                    <option value="low">Under 10,000 ETB</option>
                    <option value="mid">10,000 - 30,000 ETB</option>
                    <option value="high">Above 30,000 ETB</option>
                </select>
            </div>
            
            <a href="shop.html" class="continue-link">← Reset Shop</a>
        </aside>

        <main class="main-shop">
            <div class="product-grid" id="productGrid">
                </div>
        </main>
    </div>

    <div id="toast" class="toast">Item added to cart!</div>

    <footer class="footer">
        <p>&copy; 2026 Hossana Furniture Store. Hadiya Zone, Ethiopia.</p>
    </footer>

    <script src="js/shop.js"></script>
</body>
</html>
