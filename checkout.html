<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Hossana Furniture</title>
    <link rel="stylesheet" href="css/chackout.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <nav class="navbar">
        <div class="container nav-flex">
            <div class="logo">Hossana <span>Furniture</span></div>
        </div>
    </nav>

    <main class="container checkout-wrapper">
        <div class="step-progress">
            <div class="step active" id="st1"><span>1</span> Cart</div>
            <div class="step" id="st2"><span>2</span> Info</div>
            <div class="step" id="st3"><span>3</span> Pay</div>
            <div class="step" id="st4"><span>4</span> Review</div>
        </div>

        <section id="cart-section" class="checkout-step">
            <div class="glass-card">
                <h2 class="section-title"><i class="fas fa-shopping-basket"></i> Your Shopping Cart</h2>
                <div class="table-responsive">
                    <table class="cart-table">
                        <thead>
                            <tr>
                                <th>Product Details</th>
                                <th>Price</th>
                                <th>Qty</th>
                                <th>Total</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="cart-table-body">
                            </tbody>
                    </table>
                </div>
                <div class="cart-actions">
                    <button class="btn-clear" onclick="clearCart()">🗑 Clear All</button>
                    <button class="btn-primary" onclick="showSection('info-section')">Shipping Details →</button>
                </div>
            </div>
        </section>

        <section id="info-section" class="checkout-step" style="display:none;">
            <div class="glass-card">
                <h2 class="section-title"><i class="fas fa-map-marker-alt"></i> Shipping Address</h2>
                <div class="form-grid">
                    <div class="input-group full">
                        <label>Full Name</label>
                        <input type="text" id="cust-name" placeholder="John Doe">
                    </div>
                    <div class="input-group">
                        <label>Phone Number</label>
                        <input type="tel" id="cust-phone" placeholder="+251 9...">
                    </div>
                    <div class="input-group">
                        <label>Select Region</label>
                        <select id="cust-region">
                            <option value="Addis Ababa">Amahara</option>
                            <option value="Central Ethiopia">Central Ethiopia</option>
                            <option value="Amhara">South western</option>
                            <option value="Oromia">Oromia</option>
                            <option value="Harari">Harari</option>
                            <option value="Harari">Harari</option>
                            <option value="Harari">Harari</option>
                            <option value="Harari">Harari</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>City</label>
                        <input type="text" id="cust-city" placeholder="e.g. Hossana">
                    </div>
                    <div class="input-group">
                        <label>House No.</label>
                        <input type="text" id="cust-hno" placeholder="e.g. 102">
                    </div>
                    <div class="input-group full">
                        <label>Specific Address / Landmark</label>
                        <input type="text" id="cust-address" placeholder="Near the main Square">
                    </div>
                </div>
                <div class="cart-actions">
                    <button class="btn-secondary" onclick="showSection('cart-section')">Back</button>
                    <button class="btn-primary" onclick="showSection('payment-section')">Payment Method →</button>
                </div>
            </div>
        </section>

        <section id="payment-section" class="checkout-step" style="display:none;">
    <div class="glass-card">
        <h2 class="section-title"><i class="fas fa-wallet"></i> Payment Method</h2>
        <div class="payment-grid">
            
            <label class="pay-card">
                <input type="radio" name="payment" value="Cash on Delivery" checked>
                <div class="pay-content">
                    <i class="fas fa-hand-holding-dollar"></i>
                    <span>Cash on Delivery</span>
                    <div class="check-badge"><i class="fas fa-check"></i></div>
                </div>
            </label>

            <label class="pay-card">
                <input type="radio" name="payment" value="Telebirr">
                <div class="pay-content">
                    <i class="fas fa-mobile-screen"></i>
                    <span>Telebirr</span>
                    <div class="check-badge"><i class="fas fa-check"></i></div>
                </div>
            </label>

            <label class="pay-card">
                <input type="radio" name="payment" value="CBE Birr">
                <div class="pay-content">
                    <i class="fas fa-building-columns"></i>
                    <span>CBE Birr</span>
                    <div class="check-badge"><i class="fas fa-check"></i></div>
                </div>
            </label>
        </div>
        
        <div class="cart-actions">
            <button class="btn-secondary" onclick="showSection('info-section')">Back</button>
            <button class="btn-primary" onclick="showSection('review-section')">Final Review →</button>
        </div>
    </div>
</section>

        <section id="review-section" class="checkout-step" style="display:none;">
            <div class="glass-card">
                <h2 class="section-title"><i class="fas fa-check-double"></i> Order Confirmation</h2>
                <div class="review-layout">
                    <div class="rev-col">
                        <div class="info-box">
                            <h4>Customer</h4>
                            <p id="rev-name">--</p>
                            <p id="rev-phone">--</p>
                        </div>
                        <div class="info-box">
                            <h4>Shipping To</h4>
                            <p id="rev-location">--</p>
                            <p id="rev-addr">--</p>
                        </div>
                        <div class="info-box">
                            <h4>Payment Method</h4>
                            <p id="rev-pay">--</p>
                        </div>
                    </div>
                    <div class="rev-col order-summary">
                        <h4 class="sum-title">Summary</h4>
                        <div id="rev-items"></div>
                        <div class="total-row">
                            <span>Total Payable:</span>
                            <span id="rev-total">0 ETB</span>
                        </div>
                    </div>
                </div>
                <div class="cart-actions">
                    <button class="btn-secondary" onclick="showSection('payment-section')">Edit Payment</button>
                    <button class="btn-order" onclick="placeOrder()">Confirm & Place Order</button>
                </div>
            </div>
        </section>

        <div id="success-modal" class="modal" style="display:none;">
            <div class="modal-content">
                <div class="success-header">
                    <div class="check-anim"><i class="fas fa-circle-check"></i></div>
                    <h2>Order Successful!</h2>
                    <p>Transaction ID: #HF-<span id="final-order-id"></span></p>
                </div>
                <div id="final-receipt" class="receipt-body"></div>
                <div class="modal-footer">
                    <button onclick="window.print()" class="btn-print"><i class="fas fa-print"></i> Print Receipt</button>
                    <button onclick="window.location.href='index.html'" class="btn-primary">Back to Home</button>
                </div>
            </div>
        </div>
    </main>

    <script src="js/checkout.js"></script>
</body>
</html>
